<svg xmlns="http://www.w3.org/2000/svg" width="140" height="36" viewBox="0 0 140 36">
  <!-- Spritesheet: 5 frames of 28x36, facing right. 0 idle, 1-2 run, 3 jump, 4 fall. -->
  <defs>
    <g id="eyes">
      <ellipse cx="15" cy="15" rx="3.2" ry="3.8" fill="#ffffff"/>
      <ellipse cx="21.5" cy="15" rx="3.2" ry="3.8" fill="#ffffff"/>
      <circle cx="16.3" cy="15.6" r="1.7" fill="#1d2333"/>
      <circle cx="22.8" cy="15.6" r="1.7" fill="#1d2333"/>
    </g>
    <path id="leaf" d="M14 7 q 2 -6 8 -5 q -2 5 -8 5 z" fill="#4cc9a0"/>
  </defs>

  <!-- 0: idle -->
  <g>
    <rect x="7" y="29" width="6" height="6" rx="2" fill="#3f9e5c"/>
    <rect x="16" y="29" width="6" height="6" rx="2" fill="#3f9e5c"/>
    <rect x="3" y="7" width="22" height="24" rx="8" fill="#7cf29c"/>
    <rect x="3" y="21" width="22" height="10" rx="5" fill="#62d886"/>
    <use href="#leaf"/>
    <use href="#eyes"/>
  </g>

  <!-- 1: run, legs apart -->
  <g transform="translate(28 0)">
    <rect x="3" y="28" width="6" height="6" rx="2" fill="#3f9e5c"/>
    <rect x="19" y="29" width="6" height="6" rx="2" fill="#3f9e5c"/>
    <rect x="3" y="6" width="22" height="24" rx="8" fill="#7cf29c"/>
    <rect x="3" y="20" width="22" height="10" rx="5" fill="#62d886"/>
    <use href="#leaf" transform="translate(0 -1)"/>
    <use href="#eyes" transform="translate(0 -1)"/>
  </g>

  <!-- 2: run, legs together -->
  <g transform="translate(56 0)">
    <rect x="10" y="29" width="6" height="6" rx="2" fill="#3f9e5c"/>
    <rect x="14" y="28" width="6" height="6" rx="2" fill="#3f9e5c"/>
    <rect x="3" y="7" width="22" height="24" rx="8" fill="#7cf29c"/>
    <rect x="3" y="21" width="22" height="10" rx="5" fill="#62d886"/>
    <use href="#leaf"/>
    <use href="#eyes"/>
  </g>

  <!-- 3: jump, stretched -->
  <g transform="translate(84 0)">
    <rect x="8" y="28" width="5" height="7" rx="2" fill="#3f9e5c"/>
    <rect x="15" y="28" width="5" height="7" rx="2" fill="#3f9e5c"/>
    <rect x="4" y="3" width="20" height="27" rx="8" fill="#7cf29c"/>
    <rect x="4" y="19" width="20" height="11" rx="5" fill="#62d886"/>
    <use href="#leaf" transform="translate(0 -4)"/>
    <use href="#eyes" transform="translate(-0.5 -3)"/>
  </g>

  <!-- 4: fall, squashed, looking down -->
  <g transform="translate(112 0)">
    <rect x="4" y="29" width="7" height="6" rx="2" fill="#3f9e5c"/>
    <rect x="17" y="29" width="7" height="6" rx="2" fill="#3f9e5c"/>
    <rect x="1" y="10" width="26" height="21" rx="8" fill="#7cf29c"/>
    <rect x="1" y="22" width="26" height="9" rx="4.5" fill="#62d886"/>
    <use href="#leaf" transform="translate(0 3)"/>
    <ellipse cx="15" cy="18" rx="3.2" ry="3.8" fill="#ffffff"/>
    <ellipse cx="21.5" cy="18" rx="3.2" ry="3.8" fill="#ffffff"/>
    <circle cx="16" cy="20" r="1.7" fill="#1d2333"/>
    <circle cx="22.5" cy="20" r="1.7" fill="#1d2333"/>
  </g>
</svg>
