name: Release

# Publishes @ludra/core and @ludra/cli to npm when a version tag is pushed,
# then creates the GitHub release:
#   git tag v0.91.0 && git push origin v0.91.0
# Needs an NPM_TOKEN repository secret (an npm token allowed to publish
# both packages). A version already on npm, or a release that already
# exists, is skipped, so a release that failed halfway can be finished by
# re-running this workflow.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance: links each published version to this workflow run

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install
        run: npm ci

      - name: Tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in packages/core packages/physics packages/three packages/cli; do
            version=$(node -p "require('./$pkg/package.json').version")
            if [ "$version" != "$tag" ]; then
              echo "::error::$pkg is $version but the tag is v$tag. Bump the versions first."
              exit 1
            fi
          done

      - name: Build and test
        run: |
          npm run build
          npm test

      # In dependency order: physics and three need core, the CLI needs all three.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in packages/core packages/physics packages/three packages/cli; do
            name=$(node -p "require('./$pkg/package.json').name")
            version=$(node -p "require('./$pkg/package.json').version")
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "::notice::$name@$version is already on npm, skipping."
              continue
            fi
            npm publish --workspace "$pkg" --provenance --access public
          done

      # Notes come from docs/releases/<tag>.md when it exists (its first line,
      # "# <title>", becomes the title); otherwise GitHub writes them from the
      # merged pull requests.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice::The $tag release already exists, skipping."
            exit 0
          fi
          notes="docs/releases/$tag.md"
          if [ -f "$notes" ]; then
            title=$(head -n 1 "$notes" | sed 's/^# *//')
            tail -n +2 "$notes" > "$RUNNER_TEMP/notes.md"
            gh release create "$tag" --verify-tag --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          else
            echo "::notice::No $notes, so the notes are generated from pull requests."
            version="${tag#v}"
            npm="Published to npm: [@ludra/core@$version](https://www.npmjs.com/package/@ludra/core/v/$version), [@ludra/physics@$version](https://www.npmjs.com/package/@ludra/physics/v/$version) and [@ludra/cli@$version](https://www.npmjs.com/package/@ludra/cli/v/$version)."
            gh release create "$tag" --verify-tag --title "$tag" --generate-notes --notes "$npm"
          fi
