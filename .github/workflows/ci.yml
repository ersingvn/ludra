name: CI

# Pull requests are checked as they are; main is checked again after each merge.
# Branch pushes don't run it twice, and version tags are covered by the Release workflow.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (type-check)
        run: npm run build

      - name: Type-check game scripts (templates, blocks, examples)
        run: npm run check:scripts

      - name: Unit tests
        run: npm test

      - name: Example games and templates
        shell: bash
        run: |
          for game in examples/*/ packages/cli/templates/*/; do
            echo "::group::$game"
            npm run -s ludra -- check "$game"
            npm run -s ludra -- test "$game"
            # Templates are what agents start from, so they must review clean.
            case "$game" in packages/cli/templates/*) npm run -s ludra -- review --strict "$game" ;; esac
            echo "::endgroup::"
          done

      - name: Built CLI works without the dev condition
        shell: bash
        run: node packages/cli/dist/index.js test examples/slime-valley

      - name: Packed packages install and run in a clean project
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pack" "$RUNNER_TEMP/app"
          npm pack --workspace packages/core --workspace packages/physics --workspace packages/three --workspace packages/cli --pack-destination "$RUNNER_TEMP/pack"
          cd "$RUNNER_TEMP/app"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/pack/*.tgz
          for template in platformer topdown breakout physics; do
            npx ludra new "$template" --template "$template"
            npx ludra check "$template"
            npx ludra test "$template"
          done
