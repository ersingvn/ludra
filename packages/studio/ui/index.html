<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Ludra Studio</title>
    <link rel="stylesheet" href="studio.css" />
    <script type="module" src="dist/main.js"></script>
  </head>
  <body>
    <div id="app">
      <header id="toolbar" class="toolbar"></header>
      <aside id="left" class="panel"></aside>
      <div class="split split-x" data-split="left" title="Drag to resize, double-click to reset"></div>
      <main id="center" class="panel center"></main>
      <div class="split split-y" data-split="bottom" title="Drag to resize, double-click to reset"></div>
      <section id="bottom" class="panel"></section>
      <div class="split split-x" data-split="right" title="Drag to resize, double-click to reset"></div>
      <aside id="right" class="panel"></aside>
      <footer id="statusbar" class="statusbar"></footer>
    </div>
  </body>
</html>
