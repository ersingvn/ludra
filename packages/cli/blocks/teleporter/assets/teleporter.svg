  </g>
  <g transform="translate(40 0)">
    <rect x="0" y="6" width="40" height="6" rx="2" fill="#2b3150"/>
    <ellipse cx="20" cy="6" rx="18" ry="4" fill="#3aa6c8"/>
    <ellipse cx="20" cy="6" rx="14" ry="3" fill="#7fe0ff"/>
    <ellipse cx="20" cy="6" rx="6" ry="1.4" fill="#ffffff"/>
  </g>
